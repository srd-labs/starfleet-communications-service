apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: starfleet-communications-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: starfleet-communications-service

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
